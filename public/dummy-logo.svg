<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Circle Badge -->
  <circle cx="120" cy="120" r="110" fill="url(#brandGrad)" filter="url(#shadow)" />
  <circle cx="120" cy="120" r="102" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,4" />
  <circle cx="120" cy="120" r="94" fill="#ffffff" />

  <!-- Cup Illustration -->
  <g transform="translate(68, 62)">
    <!-- Steam Lines -->
    <path d="M 36 12 Q 32 4, 38 -4" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 52 14 Q 48 2, 54 -6" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 68 12 Q 64 4, 70 -4" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Coffee Cup Body -->
    <path d="M 20 28 L 84 28 C 84 62, 74 78, 52 78 C 30 78, 20 62, 20 28 Z" fill="url(#brandGrad)" />
    
    <!-- Cup Inner Rim -->
    <ellipse cx="52" cy="28" rx="32" ry="7" fill="#047857" />
    <ellipse cx="52" cy="28" rx="28" ry="5.5" fill="#d97706" />

    <!-- Cup Handle -->
    <path d="M 80 36 C 96 36, 96 60, 80 60" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Saucer / Base -->
    <path d="M 12 84 L 92 84 C 95 84, 98 86, 96 89 C 90 95, 74 98, 52 98 C 30 98, 14 95, 8 89 C 6 86, 9 84, 12 84 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="120" y="182" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#064e3b" letter-spacing="1.5">SEYALPRO STORE</text>
  <text x="120" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" fill="#d97706" letter-spacing="2">AUTHENTIC &amp; FRESH</text>

  <!-- Stars -->
  <path d="M 45 178 L 47 183 L 52 183 L 48 186 L 50 191 L 45 188 L 40 191 L 42 186 L 38 183 L 43 183 Z" fill="#fbbf24" />
  <path d="M 195 178 L 197 183 L 202 183 L 198 186 L 200 191 L 195 188 L 190 191 L 192 186 L 188 183 L 193 183 Z" fill="#fbbf24" />
</svg>
