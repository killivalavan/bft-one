<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Background Gradient: Deep Slate to Royal Blue to Electric Sky -->
    <linearGradient id="seyalBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="35%" stop-color="#1E3A8A" />
      <stop offset="75%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Gloss Top Highlight -->
    <linearGradient id="seyalGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="12" y="12" width="216" height="216" rx="46" fill="url(#seyalBgGrad)" />

  <!-- Subtle Inset Rim -->
  <rect x="13.5" y="13.5" width="213" height="213" rx="44.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Top-Half Gloss Highlight -->
  <rect x="13" y="13" width="214" height="106" rx="45" fill="url(#seyalGloss)" />

  <!-- Top Spark Nexus Accent (Clean 4-point spark) -->
  <g transform="translate(120, 72)">
    <circle cx="0" cy="0" r="5" fill="#38BDF8" opacity="0.4" />
    <path
      d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z"
      fill="#FFFFFF"
    />
  </g>

  <!-- SeyalPro Typography (Bold, Centered, Clean) -->
  <text x="120" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="0.5">
    <tspan fill="#FFFFFF">Seyal</tspan><tspan fill="#38BDF8">Pro</tspan>
  </text>

  <!-- Sleek Horizontal Divider -->
  <path d="M 46 145 L 102 145" stroke="url(#cyanGrad)" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="120" cy="145" r="3" fill="#38BDF8" />
  <path d="M 138 145 L 194 145" stroke="url(#cyanGrad)" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" />

  <!-- Tagline / Subtitle -->
  <text x="120" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="11" fill="#93C5FD" letter-spacing="4">
    BUSINESS OS
  </text>
</svg>
